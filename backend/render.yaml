services:
  - type: web
    name: reminderpro-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: excel-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
